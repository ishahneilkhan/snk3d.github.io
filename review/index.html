<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shah Neil Khan — 3D Design Review</title><meta name="robots" content="noindex"><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#0c0c0e"></head>
<body><a href="../index.html" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;z-index:50;background:rgba(22,21,26,.88);border:1px solid #4a3f27;color:#d4af37;padding:6px 12px;border-radius:999px;font:.8rem system-ui,sans-serif;text-decoration:none">← হোম</a><main><div id="app"></div></main>
<script src="../config.js"></script><script src="common.js"></script>
<script>
const app=document.getElementById('app'),API=(window.SNK_API||'').replace(/\/$/,'');
function home(msg){
  app.innerHTML=`<div class="center box"><div class="mono">3D Design Review</div><h1>Shah Neil Khan</h1><p class="mono" style="margin:0 0 16px">3D Designer · Interior</p>
  <label class="mono" for="cd">প্রজেক্ট কোড</label><input id="cd" autocomplete="off" placeholder="আপনার কোড লিখুন"><p class="err" id="er">${msg?esc(msg):''}</p><button class="pri" id="go">খুলুন</button></div>`;
  const go=()=>{const v=document.getElementById('cd').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(v){history.replaceState(null,'','#'+v);load(v)}else document.getElementById('er').textContent='কোড লিখুন'};
  document.getElementById('go').onclick=go;document.getElementById('cd').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function load(code){
  app.innerHTML='<p class="mono" style="padding:24px">লোড হচ্ছে…</p>';
  try{
    const r=await fetch(API+'/api/project/'+encodeURIComponent(code));
    if(r.status===404){history.replaceState(null,'','#');home('কোড মেলেনি');return}
    if(!r.ok)throw new Error('http '+r.status);
    const p=await r.json();
    renderProject(app,{title:p.title,client:p.client,code:p.code,date:(p.created_at||'').slice(0,10),img:p.drawing_url?API+p.drawing_url:'',src:p.scene_code||''});
    app.insertAdjacentHTML('afterbegin','<button id="bk">← অন্য কোড</button>');
    document.getElementById('bk').onclick=()=>{history.replaceState(null,'','#');home()};
  }catch(e){home('সার্ভারের সাথে যোগাযোগ করা যায়নি। একটু পরে আবার চেষ্টা করুন।')}
}
function start(){const c=location.hash.slice(1).toUpperCase().replace(/[^A-Z0-9]/g,'');c?load(c):home()}
addEventListener('hashchange',start);start();
</script><script src="../lang.js"></script></body></html>
